<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>У меня к тебе вопросик 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page page-home">
  <div class="hearts" aria-hidden="true"></div>

  <main class="card floating">
    <div class="badge">special invite</div>

    <div class="character" aria-hidden="true">
      <div class="face">
        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>
        <span class="blush blush-left"></span>
        <span class="blush blush-right"></span>
        <span class="smile"></span>
      </div>
    </div>

    <p class="eyebrow">pov: я сделала сайт ради одного вопроса</p>
    <h1>Пойдёшь со мной на свидание? 🌷</h1>
    <p class="subtitle">
      Обещаю: вкусный кофе, милые разговоры, красивые фотки и очень хорошую компанию.
    </p>

    <div class="actions" id="choiceArea">
      <a class="btn btn-yes pulse" href="yes.html">Дааа 💖</a>
      <button class="btn btn-no" id="noBtn" type="button">Неа 🙈</button>
    </div>

    <p class="hint">Подсказка: правильный ответ очень красивый.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
